services:
  app:
    image: node:24-slim
    container_name: football-tracker
    user: "1000:1000"
    working_dir: /app
    volumes: [".:/app"]
    environment: { HOST: 0.0.0.0, PORT: 3000 }
    command: npm run live
    restart: unless-stopped
    networks: [web]

networks:
  web:
    external: true
